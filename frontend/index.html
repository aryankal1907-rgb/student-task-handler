<!doctype html>
<html lang="en" data-theme="sunset" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="logo" title="FocusMate"><span></span><span></span><span></span></div>
    <button class="nav on" data-view="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><b>Home</b></button>
    <button class="nav" data-view="tasks" aria-label="Tasks"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg><b>Tasks</b></button>
    <button class="nav" data-view="calendar" aria-label="Calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><b>Calendar</b></button>
    <button class="nav" data-view="focus" aria-label="Focus timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M9 3h6"/></svg><b>Focus</b></button>
    <button class="nav" data-view="insights" aria-label="Insights"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><b>Insights</b></button>
    <button class="nav" data-view="trash" aria-label="Deleted tasks"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg><b>Deleted</b><i id="trashCount" hidden></i></button>
  </nav>

  <main>
    <header class="top">
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Search tasks, or type an ID  ( / )" autocomplete="off" aria-label="Search tasks"></div>
      <div class="top-actions">
        <button class="ghost" id="undoBtn" title="Undo (Z)">Undo</button>
        <button class="ghost" id="redoBtn" title="Redo (Shift+Z)">Redo</button>
        <div class="chip streak" id="streakChip" title="Day streak"><span>🔥</span><b id="streakNum">0</b></div>
        <button class="icon" id="modeBtn" aria-label="Toggle light and dark mode"></button>
        <button class="icon" id="settingsBtn" aria-label="Appearance and settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2L10 21h4l.6-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg></button>
        <button class="primary" id="addBtn">+ New task</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div class="pop" id="settings" hidden>
  <h3>Make it yours</h3>
  <label>Your name<input id="nameInput" maxlength="20" placeholder="Student"></label>
  <div class="lbl">Theme</div>
  <div class="swatches" id="swatches"></div>
  <div class="lbl">Mode</div>
  <div class="seg" id="modeSeg"><button data-m="light">Light</button><button data-m="dark">Dark</button><button data-m="auto">Auto</button></div>
  <label><span>Daily goal: <b id="goalVal">3</b> tasks</span><input id="goalInput" type="range" min="1" max="8"></label>
  <button class="ghost wide" id="notifyBtn">Turn on deadline reminders</button>
</div>

<dialog id="taskDlg">
  <form method="dialog" id="taskForm">
    <h2 id="dlgTitle">New task</h2>
    <div class="grid2">
      <label>Type<select id="fType"></select></label>
      <label>Deadline<input id="fDate" type="date" required></label>
    </div>
    <label>Subject<input id="fSubject" list="subjectList" maxlength="30" placeholder="e.g. dsa" required><datalist id="subjectList"></datalist></label>
    <label>What needs doing?<input id="fName" maxlength="60" placeholder="e.g. Finish tutorial 6" required></label>
    <p class="hint" id="fHint"></p>
    <div class="row end"><button type="button" class="ghost" id="dlgCancel">Cancel</button><button class="primary" id="dlgSave">Add task</button></div>
  </form>
</dialog>

<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
